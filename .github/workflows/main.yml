name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Chirurghi-Fantacalcio.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chirurghi-Fantacalcio-APK
          path: Chirurghi-Fantacalcio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true

      - name: Create latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-latest \
            Chirurghi-Fantacalcio.apk \
            --title "Chirurghi Fantacalcio - Ultima versione Android" \
            --notes "APK Android aggiornato automaticamente dall'ultima versione disponibile su main." \
            --latest
